name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Install, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test

      - name: Production build (Tailwind + LiveKit bundle + tsc)
        run: npm run build

      - name: Verify runtime artifacts exist
        run: |
          test -f dist/server/index.js
          test -f css/tailwind.generated.css
          test -f public/vendor/livekit-client.js
